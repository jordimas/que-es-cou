name: Deploy static site (reusable)
on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      deploy_dir:
        required: false
        type: string
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Prepare static site
        run: |
          rm -rf output
          mkdir -p output
          cp static/index.html output/index.html
          cp static/robots.txt output/robots.txt
          touch output/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ github.workspace }}/output
          destination_dir: ${{ inputs.deploy_dir }}
          keep_files: false
